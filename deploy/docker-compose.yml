# Production services: the relay (events + report lookups for the app) and the keeper (locks and
# settles rounds). Run from the repository root:
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
# Needs in .env: NEXT_PUBLIC_CONTRACT_ADDRESS, NEXT_PUBLIC_CONTRACT_DEPLOY_BLOCK, NEXT_PUBLIC_CHAIN_ID
# (143 for mainnet), KEEPER_PRIVATE_KEY, ALLOWED_ORIGINS (the app's https origin(s), comma-separated).
# Put the relay behind HTTPS (a reverse proxy or your platform's load balancer); browsers on an
# https site cannot use an http relay.
services:
  relay:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_CONTRACT_ADDRESS: ${NEXT_PUBLIC_CONTRACT_ADDRESS}
      NEXT_PUBLIC_CONTRACT_DEPLOY_BLOCK: ${NEXT_PUBLIC_CONTRACT_DEPLOY_BLOCK}
      NEXT_PUBLIC_CHAIN_ID: ${NEXT_PUBLIC_CHAIN_ID:-10143}
      NEXT_PUBLIC_RPC_URL: ${NEXT_PUBLIC_RPC_URL:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS to the app's origin(s), comma-separated}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      PORT: 8787
    ports: ["8787:8787"]
    volumes: [relay-data:/app/data]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  keeper:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    command: ["node", "scripts/house_keeper.js", "--mode", "live", "--network", "testnet"]
    environment:
      NEXT_PUBLIC_CONTRACT_ADDRESS: ${NEXT_PUBLIC_CONTRACT_ADDRESS}
      NEXT_PUBLIC_CHAIN_ID: ${NEXT_PUBLIC_CHAIN_ID:-10143}
      NEXT_PUBLIC_RPC_URL: ${NEXT_PUBLIC_RPC_URL:-}
      KEEPER_PRIVATE_KEY: ${KEEPER_PRIVATE_KEY:?set KEEPER_PRIVATE_KEY}
      KEEPER_HEALTH_PORT: 8788
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8788/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  relay-data:
